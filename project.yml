# xcodegen project spec — run `xcodegen generate` to produce iDownloadManager.xcodeproj
name: iDownloadManager
options:
  bundleIdPrefix: tr.ademyuce
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "5"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES

targets:
  iDownloadManager:
    type: application
    platform: macOS
    sources:
      - path: App/Sources/DownloadManager
      - path: App/Assets.xcassets
      - path: App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: iDownload Manager
        CFBundleName: iDownload Manager
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        LSApplicationCategoryType: public.app-category.utilities
        # Menu bar app: no Dock icon at launch; AppPresence switches to .regular while a window is open.
        LSUIElement: true
        NSHighResolutionCapable: true
        # Gerekli: indirme yöneticisi kullanıcının verdiği keyfi http:// URL'leri de
        # indirmeli. Birinci-taraf uçlar (GitHub API/releases, araç indirmeleri)
        # kodda sabit https URL'lerdir; güvenlik duyarlı hiçbir akış düz metin kullanmaz.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSHumanReadableCopyright: MIT License — Mesut Çevik
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.cs.allow-unsigned-executable-memory: true
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_NAME: iDownload Manager
        PRODUCT_BUNDLE_IDENTIFIER: tr.ademyuce.idownloadmanager
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - target: SafariExtension
        embed: true
      # Native messaging host: browsers start it to launch the app (see NativeHost/main.swift)
      - target: NativeHost
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    postCompileScripts:
      - name: Embed yt-dlp, ffmpeg & aria2c (Contents/Helpers)
        shell: /bin/zsh
        script: |
          set -e
          HELPERS="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$HELPERS"
          for tool in yt-dlp ffmpeg aria2c; do
            if [[ -f "$SRCROOT/Tools/$tool" ]]; then
              cp -f "$SRCROOT/Tools/$tool" "$HELPERS/$tool"
              chmod +x "$HELPERS/$tool"
            else
              echo "warning: Tools/$tool missing — run scripts/fetch-tools.sh (the app will fall back to a system copy)"
            fi
          done
          # Unpacked copy of the extension for Chrome
          rm -rf "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ChromeExtension"
          cp -R "$SRCROOT/Extension" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ChromeExtension"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/yt-dlp
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/ffmpeg

  NativeHost:
    type: tool
    platform: macOS
    sources:
      - path: NativeHost
    settings:
      base:
        PRODUCT_NAME: mcdm-native-host
        PRODUCT_BUNDLE_IDENTIFIER: tr.ademyuce.idownloadmanager.nativehost
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES

  SafariExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: SafariExtension/SafariWebExtensionHandler.swift
      - path: Extension
        buildPhase: resources
        excludes: ["icons", "_locales"]
      - path: Extension/icons
        type: folder
        buildPhase: resources
      - path: Extension/_locales
        type: folder
        buildPhase: resources
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: iDownload Manager
        CFBundleDevelopmentRegion: en
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
        NSHumanReadableDescription: Sends browser downloads to the iDownload Manager app and captures videos on pages.
    entitlements:
      path: SafariExtension/SafariExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: iDownload Manager Extension
        PRODUCT_BUNDLE_IDENTIFIER: tr.ademyuce.idownloadmanager.safari
        CODE_SIGN_IDENTITY: "-"
